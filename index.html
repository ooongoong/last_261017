  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {

  /* ============ BGM PLAYER (고정 버튼) ============ */
  .bgm-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(74, 70, 64, 0.72);
    backdrop-filter: blur(3px);
    color: #fffefc;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10000;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    transition: background 0.2s ease;
  }
  .bgm-btn:hover { background: rgba(74, 70, 64, 0.88); }

  .bgm-btn .leaf-icon {
    width: 24px;
    height: 24px;
    object-fit: contain;
    display: block;
  }

  /* 재생 중일 때 은은하게 회전하는 음반(디스크) 느낌 */
  .bgm-btn.playing {
    animation: bgm-spin 6s linear infinite;
  }
  @keyframes bgm-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* ============ INTRO POPUP (첫 화면 안내) ============ */
  .intro-popup-overlay {
    position: fixed;
    inset: 0;
    z-index: 10400;
    pointer-events: none;
  }
  .intro-popup-overlay.hidden { display: none; }
  .intro-popup-close {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(74, 70, 64, 0.72);
    backdrop-filter: blur(3px);
    color: #fffefc;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
  }
  .intro-popup-bgm-tip {
    position: absolute;
    top: 26px;
    right: 68px;
    max-width: 168px;
    background: rgba(74, 70, 64, 0.88);
    color: #fffefc;
    font-family: 'GyeonggiBatang', serif;
    font-size: 12.5px;
    line-height: 1.55;
    padding: 10px 13px;
    border-radius: 12px;
    text-align: left;
  }
  .intro-popup-bgm-tip::after {
    content: '';
    position: absolute;
    top: 14px;
    right: -6px;
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 6px solid rgba(74, 70, 64, 0.88);
  }
  .intro-popup-scroll-tip {
    position: absolute;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%);
    background: rgba(74, 70, 64, 0.72);
    color: #fffefc;
    font-family: 'GyeonggiBatang', serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 10px 18px;
    border-radius: 20px;
    white-space: nowrap;
    animation: intro-scroll-bounce 1.6s ease-in-out infinite;
  }
  @keyframes intro-scroll-bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(6px); }
  }
